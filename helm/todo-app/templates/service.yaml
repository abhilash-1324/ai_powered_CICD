apiVersion: v1
kind: Service
metadata:
  name: todo-app
  labels:
    app.kubernetes.io/name: todo-app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: todo-app
