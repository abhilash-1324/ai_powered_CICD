apiVersion: apps/v1
kind: Deployment
metadata: {name: sre-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: sre-demo}}
  template:
    metadata: {labels: {app: sre-demo}}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
