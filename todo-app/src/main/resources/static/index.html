<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f5f9; color: #172033; }
    body { margin: 0; padding: 3rem 1rem; }
    main { max-width: 38rem; margin: auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 1rem 3rem #17203312; }
    h1 { margin-top: 0; }
    form { display: flex; gap: .75rem; }
    input[type="text"] { flex: 1; min-width: 0; padding: .8rem; border: 1px solid #cbd2df; border-radius: .5rem; font: inherit; }
    button { padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #315bea; color: white; font: inherit; cursor: pointer; }
    button.delete { background: #a52a38; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .75rem; padding: .8rem 0; border-bottom: 1px solid #e8ebf1; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.completed span { color: #667085; text-decoration: line-through; }
    #message { min-height: 1.5rem; color: #a52a38; }
  </style>
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <form id="todo-form">
      <input id="title" type="text" maxlength="200" placeholder="What needs doing?" required>
      <button type="submit">Add todo</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <ul id="todos"></ul>
  </main>
  <script>
    const form = document.querySelector("#todo-form");
    const titleInput = document.querySelector("#title");
    const list = document.querySelector("#todos");
    const message = document.querySelector("#message");

    async function request(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`Request failed (${response.status})`);
      return response.status === 204 ? null : response.json();
    }

    async function loadTodos() {
      try {
        message.textContent = "";
        const todos = await request("/api/todos");
        list.replaceChildren();
        for (const todo of todos) {
          const item = document.createElement("li");
          item.classList.toggle("completed", todo.completed);
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = todo.completed;
          checkbox.setAttribute("aria-label", `Mark ${todo.title} complete`);
          checkbox.addEventListener("change", async () => {
            try {
              await request(`/api/todos/${todo.id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: todo.title, completed: checkbox.checked })
              });
              await loadTodos();
            } catch (error) {
              message.textContent = error.message;
              checkbox.checked = todo.completed;
            }
          });
          const label = document.createElement("span");
          label.textContent = todo.title;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.addEventListener("click", async () => {
            try {
              await request(`/api/todos/${todo.id}`, { method: "DELETE" });
              await loadTodos();
            } catch (error) {
              message.textContent = error.message;
            }
          });
          item.append(checkbox, label, remove);
          list.append(item);
        }
      } catch (error) {
        message.textContent = error.message;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await request("/api/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: titleInput.value, completed: false })
        });
        titleInput.value = "";
        await loadTodos();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loadTodos();
  </script>
</body>
</html>
