name: SRE Autopilot Copilot SDK MVP
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_failure: {description: Simulate Helm validation failure, required: false, type: boolean, default: false}
permissions:
  contents: read
jobs:
  test:
    name: Test Java app and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Test existing SDK
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Java todo app
        shell: bash
        run: |
          set -o pipefail
          mvn -B -f todo-app/pom.xml test 2>&1 | tee test.log
      - if: always()
        run: mkdir -p evidence && cp test.log evidence/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: evidence-test, path: evidence, if-no-files-found: ignore, retention-days: 3}
  sonar:
    name: SonarQube Java static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile Java and collect dependencies
        run: mvn -B -f todo-app/pom.xml test-compile dependency:copy-dependencies
      - name: Configure SonarQube kernel requirement
        run: |
          current=$(sysctl -n vm.max_map_count)
          if [ "$current" -lt 524288 ]; then
            sudo sysctl -w vm.max_map_count=524288
          fi
      - name: Test SonarQube setup script
        run: bash scripts/test-sonarqube-scan.sh
      - name: Run SonarScanner CLI against temporary SonarQube
        shell: bash
        run: bash scripts/sonarqube-scan.sh
      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: sonar-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload SonarQube evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-sonar
          path: evidence/sonar-summary.txt
          if-no-files-found: ignore
          retention-days: 3
  build:
    name: Build container and validate AKS chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - name: Build todo app container
        shell: bash
        run: |
          set -o pipefail
          docker build -t todo-app:${{ github.sha }} . 2>&1 | tee build.log
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Validate Helm chart
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ inputs.simulate_failure }}" == "true" ]]; then
            echo 'ERROR: simulated Helm validation failure' | tee helm.log
            exit 1
          fi
          helm lint helm/todo-app --set image.repository=todo-app --set image.tag=${{ github.sha }} 2>&1 | tee helm.log
          helm template todo-app helm/todo-app --set image.repository=todo-app --set image.tag=${{ github.sha }} >> helm.log
      - if: always()
        run: mkdir -p evidence; cp build.log helm.log evidence/ 2>/dev/null || true; git show --stat --oneline HEAD > evidence/change.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: evidence-build, path: evidence, if-no-files-found: ignore, retention-days: 3}
  sre-analysis:
    name: Run-specific SDK analysis
    if: always()
    needs: [test, build, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: {pattern: evidence-*, path: evidence, merge-multiple: true}
      - name: Analyze with GitHub Copilot SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVIDENCE_DIR: evidence
        run: npm run analyze
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sre-autopilot-sdk-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/analysis.md
            reports/evidence.txt
          retention-days: 14
